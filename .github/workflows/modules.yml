name: Modules

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from and commit results back to'
        required: true
        default: 'master'
      module:
        description: 'Module to build, ex. lib/bl/api/extra/sdl3 (empty means all modules)'
        required: false
        default: ''
      compiler:
        description: 'Compiler origin: download latest GitHub release or build from this branch'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - source

permissions:
  contents: write

concurrency:
  group: modules-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      MODULE: ${{ inputs.module }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Download compiler from latest GitHub release
      if: inputs.compiler == 'release'
      shell: bash
      run: |
        curl -sSL -o blc-release.zip "https://github.com/biscuitlang/bl/releases/latest/download/blc-x86_64-windows.zip"
        rm -rf blc-dist && mkdir blc-dist
        ./deps/unzip/unzip.exe -o -q blc-release.zip -d blc-dist
        if [ ! -d blc-dist/bin ] && [ "$(ls -A blc-dist | wc -l)" -eq 1 ]; then
          mv blc-dist/*/* blc-dist/
        fi
        cp -a blc-dist/bin .
        ./bin/blc.exe --version

    - name: Install module build dependencies
      shell: bash
      run: |
        # unzip comes bundled in deps/unzip; cp/rm come from Git's usr/bin; cmake drives MSBuild
        echo "C:\Program Files\Git\usr\bin" >> $GITHUB_PATH
        echo "$(pwd)/deps/unzip" >> $GITHUB_PATH

    - name: Build compiler in release mode
      shell: cmd
      if: inputs.compiler == 'source'
      run: |
        ./build.bat release

    - name: Add bin directory to PATH
      shell: bash
      run: echo "$(pwd)/bin" >> $GITHUB_PATH

    - name: Build modules
      shell: bash
      run: |
        if [ -n "$MODULE" ]; then
          blc -run build-modules.bl "$MODULE"
        else
          blc -run build-modules.bl
        fi

    - name: Collect changes as patch
      shell: bash
      run: |
        git config user.name "bl-modules-bot"
        git config user.email "actions@github.com"
        git add -A -- lib
        git -c color.ui=false diff --cached --binary > patch-win32.patch
        wc -c patch-win32.patch

    - uses: actions/upload-artifact@v4
      with:
        name: patch-win32
        path: patch-win32.patch

  linux:
    runs-on: ubuntu-latest
    env:
      MODULE: ${{ inputs.module }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}

    - name: Install LLVM
      if: inputs.compiler == 'source'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18

    - name: Download compiler from latest GitHub release
      if: inputs.compiler == 'release'
      run: |
        curl -sSL -o blc-release.zip "https://github.com/biscuitlang/bl/releases/latest/download/blc-x86_64-linux.zip"
        rm -rf blc-dist && mkdir blc-dist
        unzip -o -q blc-release.zip -d blc-dist
        if [ ! -d blc-dist/bin ] && [ "$(ls -A blc-dist | wc -l)" -eq 1 ]; then
          mv blc-dist/*/* blc-dist/
        fi
        cp -a blc-dist/bin .
        ./bin/blc --version

    - name: Install module build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
          libwayland-dev wayland-protocols libxkbcommon-dev libegl1-mesa-dev \
          libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libxss-dev \
          libxtst-dev libxinerama-dev libdecor-0-dev

    - name: Build compiler in release mode
      if: inputs.compiler == 'source'
      run: |
        ./build.sh release

    - name: Add bin directory to PATH
      run: echo "$(pwd)/bin" >> $GITHUB_PATH

    - name: Build modules
      run: |
        if [ -n "$MODULE" ]; then
          blc -run build-modules.bl "$MODULE"
        else
          blc -run build-modules.bl
        fi

    - name: Collect changes as patch
      run: |
        git config user.name "bl-modules-bot"
        git config user.email "actions@github.com"
        git add -A -- lib
        git -c color.ui=false diff --cached --binary > patch-linux.patch
        wc -c patch-linux.patch

    - uses: actions/upload-artifact@v4
      with:
        name: patch-linux
        path: patch-linux.patch

  macos:
    runs-on: macos-14
    env:
      MODULE: ${{ inputs.module }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}

    - name: Install LLVM
      if: inputs.compiler == 'source'
      run: |
        brew install llvm@18 zlib ncurses
        TMP_PATH=$(xcrun --show-sdk-path)/user/include
        echo "CPATH=$TMP_PATH" >> $GITHUB_ENV

    - name: Download compiler from latest GitHub release
      if: inputs.compiler == 'release'
      run: |
        curl -sSL -o blc-release.zip "https://github.com/biscuitlang/bl/releases/latest/download/blc-arm64-macos.zip"
        rm -rf blc-dist && mkdir blc-dist
        unzip -o -q blc-release.zip -d blc-dist
        if [ ! -d blc-dist/bin ] && [ "$(ls -A blc-dist | wc -l)" -eq 1 ]; then
          mv blc-dist/*/* blc-dist/
        fi
        cp -a blc-dist/bin .
        ./bin/blc --version

    - name: Build compiler in release mode
      if: inputs.compiler == 'source'
      run: |
        ./build.sh release

    - name: Add bin directory to PATH
      run: echo "$(pwd)/bin" >> $GITHUB_PATH

    - name: Build modules
      run: |
        if [ -n "$MODULE" ]; then
          blc -run build-modules.bl "$MODULE"
        else
          blc -run build-modules.bl
        fi

    - name: Collect changes as patch
      run: |
        git config user.name "bl-modules-bot"
        git config user.email "actions@github.com"
        git add -A -- lib
        git -c color.ui=false diff --cached --binary > patch-macos.patch
        wc -c patch-macos.patch

    - uses: actions/upload-artifact@v4
      with:
        name: patch-macos
        path: patch-macos.patch

  commit:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch }}
      MODULE: ${{ inputs.module }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}
        fetch-depth: 0

    - uses: actions/download-artifact@v4
      with:
        pattern: patch-*
        path: patches

    - name: Apply all platform patches
      run: |
        for p in patches/patch-*.patch; do
          if [ -s "$p" ]; then
            echo "Applying $p"
            git apply --index "$p"
          else
            echo "Skipping empty $p"
          fi
        done

    - name: Commit and push updated libraries
      run: |
        git config user.name "bl-modules-bot"
        git config user.email "actions@github.com"

        label="${MODULE:-all modules}"

        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git commit -m "[libs] Update prebuilt libraries for '$label' [skip ci]"
        git push origin HEAD:"$BRANCH"
